<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChipsTrader</title>
    <meta name="description" content="ChipsTrader: electronic components trading with RFQs, quotes, orders, purchasing, stock and invoicing." />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      try {
        var t = localStorage.getItem('ct-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f7fb; }
      .dark #boot { background: #0b0f1a; }
      #boot svg { width: 56px; height: 56px; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(.9); opacity: .6; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><svg viewBox="0 0 64 64"><defs><linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#bg)"/><rect x="17" y="17" width="30" height="30" rx="6" fill="#fff"/><path d="M39 26.5a8.5 8.5 0 1 0 0 11" fill="none" stroke="url(#bg)" stroke-width="4.2" stroke-linecap="round"/></svg></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
