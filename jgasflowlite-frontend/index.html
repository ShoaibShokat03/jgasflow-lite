<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JGasFlow: Gas Cylinder Shop Software</title>
    <meta name="description" content="JGasFlow: sales, udhaar, cylinder stock, purchases and payments for LPG gas shops. Works on the web and on Android, online or offline." />
    <meta name="theme-color" content="#020033" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f5fa; }
      #boot img { width: 56px; height: 56px; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(.9); opacity: .6; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
